<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Lab · 外刊词汇学习</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent2:#eef2ff;--ok:#15803d;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.app{max-width:1100px;margin:auto;padding:22px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:22px;font-weight:800}.pill{background:var(--accent2);color:var(--accent);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700}
.hero{background:linear-gradient(135deg,#111827,#3730a3);color:white;border-radius:24px;padding:30px;margin-bottom:18px;box-shadow:0 14px 35px #11182720}
.hero h1{font-size:34px;margin:0 0 8px}.hero p{margin:0;color:#dbeafe;line-height:1.7}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 25px #11182708}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-title h2{font-size:19px;margin:0}
.word{font-size:34px;font-weight:850;letter-spacing:-.5px}.phonetic{color:var(--muted);margin:5px 0 14px}.meaning{font-size:17px;line-height:1.65}.example{background:#f8fafc;border-left:4px solid var(--accent);padding:13px 15px;border-radius:10px;margin-top:15px;line-height:1.7}
textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none;background:#fff}textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4f46e51a}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;font:inherit;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#f3f4f6;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:14px}.stat b{font-size:25px;display:block}.stat span{font-size:13px;color:var(--muted)}
.quiz{margin-top:18px}.question{font-size:17px;font-weight:700;line-height:1.6}.options{display:grid;gap:9px;margin-top:13px}.option{text-align:left;background:#fff;border:1px solid var(--line)}.option:hover{border-color:var(--accent)}.result{margin-top:12px;padding:12px;border-radius:12px;display:none}.good{display:block;background:#ecfdf5;color:var(--ok)}.bad{display:block;background:#fef2f2;color:var(--bad)}
.wordlist{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#f3f4f6;border-radius:999px;padding:8px 11px;font-size:13px}
.small{font-size:13px;color:var(--muted);line-height:1.6}.divider{height:1px;background:var(--line);margin:20px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:28px}.word{font-size:30px}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">English Lab</div><div class="pill">外刊词汇 · 情境学习</div></div>

  <section class="hero">
    <h1>不要只记住“中文意思”</h1>
    <p>把单词放进陌生情境，用英文真正调用它。每次答题都会帮助你判断：这个词到底会不会用。</p>
  </section>

  <div class="grid">
    <main>
      <section class="card">
        <div class="section-title"><h2>今日词汇</h2><span id="progress" class="small">1 / 6</span></div>
        <div class="word" id="word"></div>
        <div class="phonetic" id="phonetic"></div>
        <div class="meaning" id="meaning"></div>
        <div class="example" id="example"></div>
        <div class="actions">
          <button class="secondary" onclick="prevWord()">← 上一个</button>
          <button class="primary" onclick="nextWord()">下一个 →</button>
          <button class="danger" onclick="markDifficult()">加入错词本</button>
        </div>
      </section>

      <section class="card quiz">
        <div class="section-title"><h2>陌生语境测试</h2><span class="small">不看中文</span></div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div id="result" class="result"></div>
        <div class="actions"><button class="secondary" onclick="newQuestion()">换一道</button><button class="primary" onclick="aiQuiz()">AI 出新情境题</button></div>
      </section>

      <section class="card" style="margin-top:18px">
        <div class="section-title"><h2>把你的生词放进来</h2></div>
        <p class="small">先把单词一行一个粘贴进来。这个原型会立即生成词卡；之后可以接入 OpenAI，让 AI 自动生成更自然的释义、例句、情境题和批改。</p>
        <textarea id="importWords" rows="5" placeholder="例如：
subtle
allocate
reinforce
controversial"></textarea>
        <div class="actions">
<button class="primary" onclick="importWords()">加入我的词库</button>
<button class="secondary" onclick="aiCard()">AI 生成词卡</button>
</div>
<div id="aiOutput" class="example" style="display:none"></div>
      </section>
    </main>

    <aside>
      <section class="card">
        <div class="section-title"><h2>学习数据</h2></div>
        <div class="stats">
          <div class="stat"><b id="mastered">0</b><span>已掌握</span></div>
          <div class="stat"><b id="wrong">0</b><span>待复习</span></div>
          <div class="stat"><b id="streak">1</b><span>连续学习天数</span></div>
          <div class="stat"><b id="score">0%</b><span>测试正确率</span></div>
        </div>
        <div class="divider"></div>
        <div class="section-title"><h2>我的错词</h2></div>
        <div id="difficult" class="wordlist"></div>
      </section>

      <section class="card" style="margin-top:18px">
        <div class="section-title"><h2>下一步</h2></div>
        <p class="small">① 导入你的外刊生词<br>② 完成陌生语境测试<br>③ 错词进入复习队列<br>④ 接入 OpenAI 后，让 AI 根据你的错误动态出题</p>
      </section>
    </aside>
  </div>
</div>

<script>
const baseWords=[
 {w:"subtle",p:"/ˈsʌtəl/",m:"not obvious or easy to notice; delicate or indirect",e:"The designer made a subtle change to the interface, and most users did not notice it at first."},
 {w:"allocate",p:"/ˈæləkeɪt/",m:"to officially give or set aside something for a particular purpose",e:"The school decided to allocate more money to its science program."},
 {w:"reinforce",p:"/ˌriːɪnˈfɔːrs/",m:"to make something stronger or more likely to continue",e:"The positive feedback reinforced her confidence in the new approach."},
 {w:"controversial",p:"/ˌkɑːntrəˈvɜːrʃəl/",m:"causing disagreement or strong public discussion",e:"The company made a controversial decision to change its remote-work policy."},
 {w:"plausible",p:"/ˈplɔːzəbəl/",m:"seeming reasonable or likely to be true",e:"His explanation sounded plausible, but we still needed more evidence."},
 {w:"undermine",p:"/ˌʌndərˈmaɪn/",m:"to gradually make something less strong, effective, or confident",e:"Constant interruptions can undermine a student's ability to concentrate."}
];
let words=JSON.parse(localStorage.getItem("englishLabWords")||"null")||baseWords;
let difficult=JSON.parse(localStorage.getItem("englishLabDifficult")||"[]");
let idx=0, correct=0,total=0, currentAnswer="";

function render(){
 const x=words[idx%words.length]; idx=idx%words.length;
 word.textContent=x.w; phonetic.textContent=x.p; meaning.textContent=x.m; example.innerHTML="<b>Example:</b> "+x.e;
 progress.textContent=(idx+1)+" / "+words.length; newQuestion(); renderStats();
}
function nextWord(){idx=(idx+1)%words.length;render()}
function prevWord(){idx=(idx-1+words.length)%words.length;render()}
function markDifficult(){
 const x=words[idx].w;if(!difficult.includes(x)) difficult.push(x);
 localStorage.setItem("englishLabDifficult",JSON.stringify(difficult));renderStats();
}
function renderStats(){
 mastered.textContent=Math.max(0,words.length-difficult.length);
 wrong.textContent=difficult.length; score.textContent=total?Math.round(correct/total*100)+"%":"0%";
 difficultEl=document.getElementById("difficult");
 difficultEl.innerHTML=difficult.length?difficult.map(x=>`<span class="tag">${x}</span>`).join(""):"<span class='small'>还没有错词</span>";
}
function newQuestion(){
 const x=words[idx], pool=words.map(a=>a.w).filter(w=>w!==x.w);
 const opts=[x.w,...pool.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 currentAnswer=x.w;
 question.textContent="Choose the word that best completes this sentence: “The evidence was ______ enough to convince the committee to investigate further.”";
 options.innerHTML=opts.map(o=>`<button class="option" onclick="answer('${o.replaceAll("'","&#39;")}')">${o}</button>`).join("");
 result.className="result";result.style.display="none";result.textContent="";
}
function answer(o){
 total++; const ok=o===currentAnswer;
 if(ok) correct++; else markDifficult();
 result.textContent=ok?"Correct. You recognized the word from context.":"Not quite. This is a good candidate for review.";
 result.className="result "+(ok?"good":"bad"); result.style.display="block"; renderStats();
}
async function aiCard(){
  const x=words[idx];
  const box=document.getElementById("aiBox");
  box.style.display="block";
  box.textContent="AI 正在生成……";

  try{
    const prompt=`You are an English vocabulary teacher.

Word: ${x.w}

Give me:
1. A clear English definition in simple English.
2. Two natural example sentences in different contexts.
3. A brief Chinese explanation of the word's meaning and usage.
4. One common collocation if appropriate.

Do not repeat the original article context. Use completely different everyday or academic contexts.

Format the answer clearly with headings.`;

    const r=await fetch("/api/generate",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({prompt})
    });

    const d=await r.json();

    if(!r.ok) throw new Error(d.error||"API error");

    box.innerHTML=d.text||"AI 没有返回内容。";
  }catch(e){
    console.error(e);
    box.textContent="AI 暂时无法使用，请稍后再试。";
  }
}
async function aiQuiz(){
 const x=words[idx]; const box=document.getElementById("aiOutput");
 box.style.display="block"; box.textContent="AI 正在出题…";
 try{
   const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({word:x.w,task:"context_quiz"})});
   const d=await r.json(); if(!r.ok) throw new Error(d.error||"请求失败");
   question.textContent=d.sentence+" "+d.question;
   options.innerHTML=(d.options||[]).map(o=>`<button class="option" onclick="aiAnswer(this,'${String(d.answer).replaceAll("'","&#39;")}')">${o}</button>`).join("");
   currentAnswer=d.answer;
   box.textContent="这是一道由 AI 根据当前词汇生成的新情境题。";
 }catch(e){box.textContent="AI 暂时无法使用："+e.message}
}
function aiAnswer(btn,answer){ answer=answer; total++; const ok=btn.textContent.trim()===answer.trim(); if(ok)correct++;else markDifficult(); result.textContent=ok?"Correct.":"Not quite. "+answer; result.className="result "+(ok?"good":"bad");result.style.display="block";renderStats(); }
function importWords(){
 const list=importWordsEl.value.split(/\n|,|，/).map(x=>x.trim()).filter(Boolean);
 const existing=new Set(words.map(x=>x.w));
 list.forEach(w=>{if(!existing.has(w))words.push({w,p:"",m:"Meaning will be generated by AI in the next version.",e:"Example sentence will be generated by AI in the next version."})});
 localStorage.setItem("englishLabWords",JSON.stringify(words));importWordsEl.value="";idx=words.length-list.length;render();
}
const importWordsEl=document.getElementById("importWords");
render();
</script>
</body>
</html>
